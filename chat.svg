<svg xmlns="http://www.w3.org/2000/svg" width="800" height="280" viewBox="0 0 800 280">
  <defs>
    <style>
      .text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 18px;
        fill: #e6edf3;
      }
      .title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 24px;
        font-weight: bold;
        fill: #ffffff;
      }
      .bubble { fill: #2d3139; }
      .tail { fill: #2d3139; }
      
      .b1 { opacity: 0; animation: slideIn 0.5s ease forwards 0.5s; }
      .t1 { opacity: 0; animation: typeHide 1.5s ease forwards 1.2s; }
      .b2 { opacity: 0; animation: slideIn 0.5s ease forwards 2.7s; }
      .t2 { opacity: 0; animation: typeHide 1.5s ease forwards 3.4s; }
      .b3 { opacity: 0; animation: slideIn 0.5s ease forwards 4.9s; }
      
      @keyframes slideIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes typeHide {
        0% { opacity: 0; transform: translateY(10px); }
        10% { opacity: 1; transform: translateY(0); }
        90% { opacity: 1; transform: translateY(0); }
        100% { opacity: 0; transform: translateY(0); visibility: hidden; }
      }
      
      .dot { fill: #8b949e; }
      .dot1 { animation: bounce 1s infinite ease-in-out both; animation-delay: 0s; }
      .dot2 { animation: bounce 1s infinite ease-in-out both; animation-delay: 0.15s; }
      .dot3 { animation: bounce 1s infinite ease-in-out both; animation-delay: 0.3s; }
      
      @keyframes bounce {
        0%, 80%, 100% { transform: translateY(0); }
        40% { transform: translateY(-5px); }
      }
    </style>
  </defs>

  <text x="20" y="40" class="title">Hi there 👋</text>

  <!-- Bubble 1 -->
  <g class="b1">
    <rect x="30" y="70" width="280" height="46" rx="23" class="bubble" />
    <path d="M30 93 C 30 116, 15 116, 15 116 C 25 116, 30 106, 30 93 Z" class="tail" />
    <text x="50" y="99" class="text">Hi, I'm Komal R Aradhya</text>
  </g>

  <!-- Typing Indicator 1 -->
  <g class="t1">
    <rect x="30" y="126" width="70" height="36" rx="18" class="bubble" />
    <path d="M30 144 C 30 162, 15 162, 15 162 C 25 162, 30 154, 30 144 Z" class="tail" />
    <circle cx="48" cy="144" r="4" class="dot dot1" />
    <circle cx="65" cy="144" r="4" class="dot dot2" />
    <circle cx="82" cy="144" r="4" class="dot dot3" />
  </g>

  <!-- Bubble 2 (Replaces T1) -->
  <g class="b2">
    <rect x="30" y="126" width="530" height="74" rx="23" class="bubble" />
    <path d="M30 163 C 30 200, 15 200, 15 200 C 25 200, 30 180, 30 163 Z" class="tail" />
    <text x="50" y="155" class="text">SIT Engineering | 9.70+ CGPA Baseline</text>
    <text x="50" y="181" class="text">Systems Architecture // Quant Engineering</text>
  </g>

  <!-- Typing Indicator 2 -->
  <g class="t2">
    <rect x="30" y="210" width="70" height="36" rx="18" class="bubble" />
    <path d="M30 228 C 30 246, 15 246, 15 246 C 25 246, 30 238, 30 228 Z" class="tail" />
    <circle cx="48" cy="228" r="4" class="dot dot1" />
    <circle cx="65" cy="228" r="4" class="dot dot2" />
    <circle cx="82" cy="228" r="4" class="dot dot3" />
  </g>

  <!-- Bubble 3 (Replaces T2) -->
  <g class="b3">
    <rect x="30" y="210" width="410" height="46" rx="23" class="bubble" />
    <path d="M30 233 C 30 256, 15 256, 15 256 C 25 256, 30 246, 30 233 Z" class="tail" />
    <text x="50" y="239" class="text">Building Low-Latency C++ Engines</text>
  </g>
</svg>
